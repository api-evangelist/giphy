naftiko: "1.0.0-alpha2"

info:
  label: "GIPHY API — Animate"
  description: >-
    GIPHY — Animate. 1 operation. Lead operation: Programmatically generate an
    animated text GIF from a phrase. Self-contained Naftiko capability covering one
    GIPHY business surface.
  tags:
    - GIPHY
    - Media
    - Animate
  created: "2026-05-30"
  modified: "2026-05-30"

binds:
  - namespace: env
    keys:
      GIPHY_API_KEY: GIPHY_API_KEY

capability:

  consumes:
    - type: http
      namespace: "giphy-animate"
      baseUri: "https://api.giphy.com"
      description: "GIPHY API — Animate business capability."
      authentication:
        type: apikey
        key: api_key
        value: "{{env.GIPHY_API_KEY}}"
        placement: query
      resources:
        - name: "animate"
          path: "/v1/animate"
          operations:
            - name: "animateText"
              method: GET
              description: "Programmatically generate an animated text GIF from a phrase."
              inputParameters:
                - { name: m, in: query, type: string, required: true, description: "Text or phrase to animate." }
                - { name: style, in: query, type: string, required: false, description: "Optional animation style." }
              outputRawFormat: json
              outputParameters:
                - { name: result, type: object, value: "$." }

  exposes:
    - type: rest
      namespace: "giphy-animate-rest"
      port: 8080
      description: "REST adapter for GIPHY API — Animate."
      resources:
        - path: "/v1/animate"
          name: "animate"
          description: "REST surface to animate a text phrase."
          operations:
            - method: GET
              name: "animateText"
              description: "Animate text."
              call: "giphy-animate.animateText"
              with: { m: "rest.m", style: "rest.style" }
              outputParameters:
                - { type: object, mapping: "$." }

    - type: mcp
      namespace: "giphy-animate-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for GIPHY API — Animate."
      tools:
        - name: "animate-text"
          description: "Generate an animated text GIF."
          hints: { readOnly: false, destructive: false, idempotent: false }
          call: "giphy-animate.animateText"
          with: { m: "tools.m", style: "tools.style" }
          outputParameters:
            - { type: object, mapping: "$." }
